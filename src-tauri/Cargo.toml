[package]
name = "wavecode-desktop"
version = "0.0.1"
description = "Native desktop client for WaveCode"
authors = ["Wavenetic / Denis Benic"]
license = "Apache-2.0"
repository = "https://github.com/dbenic/wavecode-desktop"
edition = "2021"
rust-version = "1.77"

[lib]
name = "wavecode_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri core
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"

# Serde for the JS bridge
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# SSH stack — the heart of the app
russh = "0.45"
russh-keys = "0.45"
russh-sftp = "2"

# Errors + logging
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Misc
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
bytes = "1"
dirs = "5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
